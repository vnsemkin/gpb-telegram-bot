<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать в Мини-банк</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px 0;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        Telegram.WebApp.ready(); // Инициализация WebApp

        function sendCommand(command) {
            // Устанавливаем текст главной кнопки
            Telegram.WebApp.MainButton.setText(command);

            // Обработчик нажатия на кнопку
            Telegram.WebApp.MainButton.onClick(() => {
                // Необязательно: закрываем веб-приложение после отправки команды
                // Telegram.WebApp.close();
            });
        }
    </script>
</head>
<body>
<div class="container">
    <h1>Добро пожаловать в Мини-банк</h1>
    <p>Ваш личный помощник в банковских услугах.</p>
    <div>
        <div class="button" onclick="sendCommand('/register')">Зарегистрироваться</div>
        <div class="button" onclick="sendCommand('/create_account')">Создать аккаунт</div>
        <div class="button" onclick="sendCommand('/current_balance')">Вывести баланс</div>
        <div class="button" onclick="sendCommand('/transfer')">Перевести деньги</div>
    </div>
</div>
</body>
</html>
