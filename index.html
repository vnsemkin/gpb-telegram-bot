<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать в Мини-банк</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px 0;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .button:active {
            background-color: #004494;
            transform: scale(0.98);
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        Telegram.WebApp.ready(); // Инициализация WebApp

        function sendCommand(command) {
            const queryId = Telegram.WebApp.initDataUnsafe.query_id;
            fetch(`https://api.telegram.org/bot6713664017:AAEsALOI7p4UGLDOyvlEXiuJ4m0MhZ5gxPo/answerWebAppQuery`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    web_app_query_id: queryId,
                    result: JSON.stringify({
                        type: "article",
                        id: command,
                        title: "Command sent",
                        input_message_content: {
                            message_text: `${command}`
                        }
                    })
                })
            }).then(response => response.json()).then(data => {
                if (data.ok) {
                    Telegram.WebApp.close(); // Close the WebApp after sending the command
                } else {
                    console.error("Error sending data:", data);
                }
            });
        }
    </script>
</head>
<body>
<div class="container">
    <h1>Добро пожаловать в Мини-банк</h1>
    <p>Ваш личный помощник в банковских услугах.</p>
    <div>
        <div class="button" onclick="sendCommand('/register')">Зарегистрироваться</div>
        <div class="button" onclick="sendCommand('/create_account')">Создать аккаунт</div>
        <div class="button" onclick="sendCommand('/current_balance')">Вывести баланс</div>
        <div class="button" onclick="sendCommand('/transfer')">Перевести деньги</div>
    </div>
</div>
</body>
</html>
